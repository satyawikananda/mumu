name: Release

# A tag such as v0.1.0 or v0.1.0-alpha.1 builds the arm64 app and its LGPL
# runtime, verifies the bundle, and uploads a draft release. The app is ad hoc
# signed: no Developer ID and no notarization. See docs/release/macos.md.
#
# The workflow follows the MyGo GitHub Actions guide for a native UI project:
# the tag is checked and the draft exists before anything is built, so a wrong
# tag fails in seconds and the upload always has a target. There is no
# workflow_dispatch: a release comes from a tag, and -upload would need the
# updater configuration this project does not have.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check the version
        id: version
        run: |
          version="$(jq -r .version mygo.json)"
          # A prerelease tag carries a suffix: v0.1.0-alpha.1, v0.1.0-rc.1.
          # mygo.json stays the bundle version, which macOS requires to be
          # period-separated integers.
          case "$GITHUB_REF_NAME" in
            "v$version" | "v$version"-*) ;;
            *)
              echo "::error::tag $GITHUB_REF_NAME does not match mygo.json $version"
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "draft release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          # A suffix marks a prerelease: v0.1.0-alpha.1, v0.1.0-rc.1.
          flags=(--draft --verify-tag --generate-notes --title "mumu $GITHUB_REF_NAME")
          if [ "${GITHUB_REF_NAME#*-}" != "$GITHUB_REF_NAME" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${flags[@]}"

      - name: Check the runner architecture
        run: |
          arch="$(uname -m)"
          if [ "$arch" != "arm64" ]; then
            echo "::error::this workflow needs an arm64 runner, got $arch"
            exit 1
          fi

      - name: Install the runtime build tools
        run: brew install meson pkg-config cmake

      - name: Cache the LGPL runtime
        uses: actions/cache@v6
        with:
          path: build/runtime
          key: libmpv-${{ hashFiles('packaging/macos/mpv-runtime.json', 'packaging/macos/build-lgpl-runtime.sh', 'packaging/macos/patches/**') }}

      - name: Build the runtime
        run: make runtime

      - name: Package and verify
        run: make package

      - name: Collect the release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          app="build/darwin-arm64/Mumu.app"
          dmg="build/darwin-arm64/mumu-${VERSION}-arm64.dmg"
          stage="build/release"
          mkdir -p "$stage"

          cp "$dmg" "$stage/"
          cp THIRD_PARTY_NOTICES.md "$stage/"

          tar -czf "$stage/mumu-libmpv-${VERSION}-arm64.tar.gz" \
            -C build/runtime/lib .

          ./packaging/macos/collect-sources.sh "$VERSION" "$stage"

          (
            cd "$stage"
            shasum -a 256 mumu-*.dmg mumu-libmpv-*.tar.gz THIRD_PARTY_NOTICES.md > SHA256SUMS
          )

          digest="$(shasum -a 256 "$stage/mumu-${VERSION}-arm64.dmg" | awk '{print $1}')"
          jq -n \
            --arg version "$VERSION" \
            --arg dmg "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/mumu-${VERSION}-arm64.dmg" \
            --arg sha "$digest" \
            --arg notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            '{version:$version,arch:"arm64",minimumSystemVersion:"13.0",signed:false,dmg:$dmg,sha256:$sha,notes:$notes}' \
            >"$stage/latest.json"

          ls -lh "$stage"

      - name: Upload the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            build/release/*
