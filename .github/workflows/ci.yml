name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
  pull_request:
    paths-ignore:
      - 'website/**'

permissions:
  contents: read

# A private repository pays for every minute. Cancel a superseded run when a
# new commit lands on the same branch instead of running both to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          out="$(gofmt -l ./cmd ./internal third_party/go-mpv)"
          if [ -n "$out" ]; then
            echo "gofmt needed:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Vendored binding
        run: |
          cd third_party/go-mpv
          go vet ./...
          go test ./...

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: Check native UI lifetimes
        run: go tool mygo vet .

      - name: Cross build
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 windows/amd64 linux/arm64 windows/arm64; do
            echo "building $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./...
          done

      - name: Guard native-only
        run: |
          test ! -e package.json
          test ! -e index.html
          # The website is a separate Astro project. The app itself must stay
          # native: no web source outside website/.
          offenders="$(git ls-files '*.ts' '*.tsx' '*.js' '*.jsx' | grep -v '^website/' || true)"
          if [ -n "$offenders" ]; then
            echo "unexpected web source outside website/:"
            echo "$offenders"
            exit 1
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Lint
        run: golangci-lint run ./cmd/... ./internal/...

  package:
    name: package (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check the runner architecture
        run: test "$(uname -m)" = arm64

      - name: Install the runtime build tools
        run: brew install meson pkg-config cmake

      - name: Cache the LGPL runtime
        uses: actions/cache@v6
        with:
          path: build/runtime
          key: libmpv-${{ hashFiles('packaging/macos/mpv-runtime.json', 'packaging/macos/build-lgpl-runtime.sh', 'packaging/macos/patches/**') }}

      - name: Package and verify
        run: make package

      - name: Native macOS headless evidence
        env:
          MUMU_MPV_LIBRARY: ${{ github.workspace }}/resources/darwin-arm64/libmpv
          MUMU_MPV_INCLUDE: ${{ github.workspace }}/build/runtime/include
        run: |
          test -d "$MUMU_MPV_LIBRARY"
          test -f "$MUMU_MPV_INCLUDE/mpv/client.h"
          bash packaging/qa/test-headless.sh

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: headless-evidence-macos-arm64
          path: build/native-evidence
          if-no-files-found: warn
